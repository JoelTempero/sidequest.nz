<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.className='js'</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidequest Digital | Be Known. Stand Out. Get Ahead.</title>
  <meta name="description" content="Sidequest Digital is a small NZ studio building apps, websites, and systems for people who want to move first. Being good is no longer enough. Being early is.">
  <link rel="canonical" href="https://sidequest.nz/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Sidequest Digital | Be Known. Stand Out. Get Ahead.">
  <meta property="og:description" content="A small NZ studio building apps, websites, and systems for people who want to move first.">
  <meta property="og:image" content="https://sidequest.nz/images/logo-icon.png">
  <meta property="og:url" content="https://sidequest.nz/">

  <link rel="icon" href="images/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <nav class="site-nav">
    <a class="site-nav__brand" href="/">
      <img src="images/logo-icon.png" alt="" width="22" height="22">
      <span>Sidequest Digital</span>
    </a>
    <a class="site-nav__link" href="/about.html">About</a>
  </nav>

  <main class="hero">
    <h1 id="hero-lines">
      <span class="hero-line">BE KNOWN.</span>
      <span class="hero-line">STAND OUT.</span>
      <span class="hero-line">GET AHEAD.</span>
    </h1>
    <p class="hero-tagline">Being good is no longer enough. <strong>Being early is.</strong></p>
  </main>

  <section class="contact-strip" aria-label="Contact">
    <div id="contact-panel">
      <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="034020f4-ef4e-4f00-9988-3e99609b86c4">
        <input type="hidden" name="subject" value="New enquiry from sidequest.nz">
        <input type="hidden" name="botcheck" value="">

        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="field field--wide">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn">Send message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>

    <div class="contact-bar">
      <button type="button" id="contact-trigger" aria-expanded="false" aria-controls="contact-panel">Get in touch</button>
      <p class="contact-direct">Or hit us up direct: <a href="mailto:joel@tempero.nz">joel@tempero.nz</a> and <a href="tel:+642040239009">0204 023 9009</a></p>
    </div>
  </section>
</body>
</html>
