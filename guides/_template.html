<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <script>document.documentElement.className='js'</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} | Sidequest Digital</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#08060d">
  <link rel="canonical" href="{{canonical}}">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Sidequest Digital">
  <meta property="og:locale" content="en_NZ">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">

  <link rel="icon" href="/images/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XDZBXRBJSW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-XDZBXRBJSW");
  </script>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>

  <nav class="site-nav">
    <a class="site-nav__brand" href="/">
      <img src="/images/logo-icon.png" alt="" width="22" height="22">
      <span>Sidequest Digital</span>
    </a>
  </nav>

  <main class="legal-main guide-main">
    <article class="guide">
      <p class="legal-eyebrow guide-eyebrow"><a href="/guides/">Guides</a></p>

      <h1 class="legal-title">{{title}}</h1>

      <p class="legal-meta">Updated {{date}}</p>

      {{hero}}

      <div class="guide-body">
{{body}}
      </div>

      <aside class="guide-cta">
        <p>Want a hand with this? <a href="/">Get in touch</a> and we will talk it through.</p>
      </aside>
    </article>
  </main>

  <footer class="site-foot">
    <p><a href="/">Return to home</a></p>
    <p><a href="/guides/">Guides</a> &middot; <a href="/pages/privacy.html">Privacy</a> &middot; <a href="/pages/terms.html">Terms</a></p>
  </footer>
</body>
</html>
